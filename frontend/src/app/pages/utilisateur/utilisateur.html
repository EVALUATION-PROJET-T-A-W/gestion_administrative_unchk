<div class="min-h-screen bg-gray-100 p-6">

  <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow">

    <h2 class="text-2xl font-bold mb-6 text-center">
      Inscription utilisateur
    </h2>

    <!-- TYPE UTILISATEUR -->
    <select
      [(ngModel)]="typeUtilisateur"
      class="w-full border rounded-xl p-2 mb-4">

      <option value="etudiant">Étudiant</option>
      <option value="formateur">Formateur</option>
      <option value="administratif">Administratif</option>

    </select>

    <!-- FORMULAIRE -->
    <form (ngSubmit)="enregistrer()" class="grid grid-cols-2 gap-4">

      <input class="input"
             [(ngModel)]="utilisateur.nom"
             name="nom"
             placeholder="Nom">

      <input class="input"
             [(ngModel)]="utilisateur.prenom"
             name="prenom"
             placeholder="Prénom">

      <input class="input col-span-2"
             [(ngModel)]="utilisateur.email"
             name="email"
             placeholder="Email">

      <input class="input"
             [(ngModel)]="utilisateur.motDePasse"
             name="motDePasse"
             type="password"
             placeholder="Mot de passe">

      <input class="input"
             [(ngModel)]="utilisateur.telephone"
             name="telephone"
             placeholder="Téléphone">

      <!-- PHOTO -->
      <input type="file"
             (change)="onFileSelected($event)"
             class="col-span-2">

      <button class="bg-blue-600 text-white p-2 rounded-xl col-span-2">
        Enregistrer
      </button>

    </form>

  </div>

</div>
