<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div class="bg-white rounded-xl shadow-md p-6 w-full max-w-xl">

    <h2 class="text-xl font-bold text-slate-700 mb-4">
      Ajouter Stage
    </h2>

    <form (ngSubmit)="ajouter()" class="space-y-3">

      <input class="w-full border rounded-xl p-2"
             [(ngModel)]="stage.entreprise"
             name="entreprise"
             placeholder="Entreprise">

      <input type="date" class="w-full border rounded-xl p-2"
             [(ngModel)]="stage.dateDebut"
             name="dateDebut">

      <input type="date" class="w-full border rounded-xl p-2"
             [(ngModel)]="stage.dateFin"
             name="dateFin">

      <input class="w-full border rounded-xl p-2"
             [(ngModel)]="stage.bilan"
             name="bilan"
             placeholder="Bilan">

      <input class="w-full border rounded-xl p-2"
             [(ngModel)]="stage.statut"
             name="statut"
             placeholder="Statut">

      <input type="number" class="w-full border rounded-xl p-2"
             [(ngModel)]="stage.etudiantId"
             name="etudiantId"
             placeholder="ID Étudiant">

      <button class="w-full bg-blue-600 text-white rounded-xl p-2 hover:shadow-lg transition-all">
        Ajouter
      </button>

    </form>

  </div>

</div>
