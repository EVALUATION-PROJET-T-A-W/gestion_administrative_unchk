<div class="min-h-screen bg-gray-100 p-6 flex justify-center">

  <div class="bg-white rounded-xl shadow-md p-6 w-full max-w-2xl">

    <h2 class="text-xl font-bold text-slate-700 mb-4">
      Ajouter un document
    </h2>

    <form (ngSubmit)="ajouter()" class="space-y-4">

      <input
        class="w-full border rounded-xl p-2"
        [(ngModel)]="document.titre"
        name="titre"
        placeholder="Titre du document">

      <input
        class="w-full border rounded-xl p-2"
        [(ngModel)]="document.typeDocument"
        name="typeDocument"
        placeholder="Type (PDF, DOC...)">

      <textarea
        class="w-full border rounded-xl p-2"
        [(ngModel)]="document.description"
        name="description"
        placeholder="Description">
      </textarea>

      <input
        type="date"
        class="w-full border rounded-xl p-2"
        [(ngModel)]="document.datePublication"
        name="datePublication">

      <input
        class="w-full border rounded-xl p-2"
        [(ngModel)]="document.administratifId"
        name="administratifId"
        placeholder="ID Administratif">

      <input
        type="file"
        class="w-full"
        (change)="onFileChange($event)">

      <button
        class="w-full bg-blue-600 text-white rounded-xl p-2 hover:shadow-lg transition-all">

        Ajouter

      </button>

    </form>

  </div>

</div>
