<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div class="bg-white rounded-xl shadow-md p-6 w-full max-w-xl">

    <h2 class="text-xl font-bold text-slate-700 mb-4">
      Détails Formation
    </h2>

    <div class="space-y-2 text-slate-700">

      <p><span class="font-semibold">Nom :</span> {{ formation?.nomFormation }}</p>
      <p><span class="font-semibold">Type :</span> {{ formation?.typeFormation }}</p>
      <p><span class="font-semibold">Niveau :</span> {{ formation?.niveau }}</p>
      <p><span class="font-semibold">Date début :</span> {{ formation?.dateDebut }}</p>
      <p><span class="font-semibold">Date fin :</span> {{ formation?.dateFin }}</p>
      <p><span class="font-semibold">Montant :</span> {{ formation?.montant }}</p>
      <p><span class="font-semibold">Description :</span> {{ formation?.description }}</p>

    </div>

  </div>

</div>
