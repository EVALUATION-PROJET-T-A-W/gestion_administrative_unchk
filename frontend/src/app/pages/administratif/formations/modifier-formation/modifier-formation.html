<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div class="bg-white rounded-xl shadow-md p-6 w-full max-w-xl">

    <h2 class="text-xl font-bold text-slate-700 mb-4">
      Modifier Formation
    </h2>

    <form (ngSubmit)="modifier()" class="space-y-3">

      <input class="w-full border rounded-xl p-2"
             [(ngModel)]="formation.nomFormation"
             name="nomFormation"
             placeholder="Nom formation">

      <input class="w-full border rounded-xl p-2"
             [(ngModel)]="formation.typeFormation"
             name="typeFormation"
             placeholder="Type formation">

      <input class="w-full border rounded-xl p-2"
             [(ngModel)]="formation.niveau"
             name="niveau"
             placeholder="Niveau">

      <input type="date" class="w-full border rounded-xl p-2"
             [(ngModel)]="formation.dateDebut"
             name="dateDebut">

      <input type="date" class="w-full border rounded-xl p-2"
             [(ngModel)]="formation.dateFin"
             name="dateFin">

      <input class="w-full border rounded-xl p-2"
             [(ngModel)]="formation.montant"
             name="montant"
             placeholder="Montant">

      <textarea class="w-full border rounded-xl p-2"
                [(ngModel)]="formation.description"
                name="description"
                placeholder="Description"></textarea>

      <button class="w-full bg-yellow-500 text-white rounded-xl p-2 hover:shadow-lg transition-all">
        Modifier
      </button>

    </form>

  </div>

</div>
