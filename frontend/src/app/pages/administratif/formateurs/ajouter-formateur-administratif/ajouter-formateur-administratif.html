<div class="max-w-5xl mx-auto">

    <div class="bg-white rounded-3xl shadow-xl overflow-hidden">

        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6">

            <h2 class="text-3xl font-bold text-white">
                👨‍🏫 Ajouter un Formateur
            </h2>

            <p class="text-blue-100 mt-2">
                Créer un nouveau compte formateur
            </p>

        </div>

        <!-- Formulaire -->
        <form #formateurForm="ngForm" (ngSubmit)="ajouterFormateur(formateurForm)" class="p-8">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <input type="text" [(ngModel)]="formateur.nom" name="nom" placeholder="Nom" required
                    class="border border-slate-300 p-4 rounded-xl">

                <input type="text" [(ngModel)]="formateur.prenom" name="prenom" placeholder="Prénom" required
                    class="border border-slate-300 p-4 rounded-xl">

                <input type="email" [(ngModel)]="formateur.email" name="email" placeholder="Email" required
                    class="border border-slate-300 p-4 rounded-xl">

                <input type="password" [(ngModel)]="formateur.motDePasse" name="motDePasse" placeholder="Mot de passe"
                    required class="border border-slate-300 p-4 rounded-xl">

                <input type="text" [(ngModel)]="formateur.telephone" name="telephone" placeholder="Téléphone"
                    class="border border-slate-300 p-4 rounded-xl">

                <input type="text" [(ngModel)]="formateur.specialite" name="specialite" placeholder="Spécialité"
                    class="border border-slate-300 p-4 rounded-xl">

                <input type="text" [(ngModel)]="formateur.grade" name="grade" placeholder="Grade"
                    class="border border-slate-300 p-4 rounded-xl">

                <input type="text" [(ngModel)]="formateur.departement" name="departement" placeholder="Département"
                    class="border border-slate-300 p-4 rounded-xl">

                <select [(ngModel)]="formateur.typeFormateur" name="typeFormateur"
                    class="border border-slate-300 p-4 rounded-xl md:col-span-2">

                    <option value="">
                        Choisir un type
                    </option>

                    <option value="ENSEIGNANT">
                        Enseignant
                    </option>

                    <option value="ENSEIGNANT_ASSOCIE">
                        Enseignant Associé
                    </option>

                    <option value="TUTEUR">
                        Tuteur
                    </option>

                </select>

            </div>

            <div class="flex justify-end mt-8 gap-3">

                <button type="reset" class="px-6 py-3 bg-slate-500 hover:bg-slate-600 text-white rounded-xl">

                    Annuler

                </button>

                <button type="submit" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-lg">

                    ➕ Ajouter le formateur

                </button>

            </div>

        </form>

    </div>

</div>
