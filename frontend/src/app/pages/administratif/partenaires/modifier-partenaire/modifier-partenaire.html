<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div class="bg-white rounded-xl shadow-md p-6 w-full max-w-xl">

    <h2 class="text-xl font-bold mb-4">Modifier Partenaire</h2>

    <form (ngSubmit)="modifier()" class="space-y-3">

      <input class="w-full border rounded-xl p-2"
             [(ngModel)]="partenaire.nom"
             name="nom">

      <input class="w-full border rounded-xl p-2"
             [(ngModel)]="partenaire.type"
             name="type">

      <input class="w-full border rounded-xl p-2"
             [(ngModel)]="partenaire.contact"
             name="contact">

      <input class="w-full border rounded-xl p-2"
             [(ngModel)]="partenaire.email"
             name="email">

      <button class="w-full bg-yellow-500 text-white rounded-xl p-2 hover:shadow-lg transition-all">
        Modifier
      </button>

    </form>

  </div>

</div>
