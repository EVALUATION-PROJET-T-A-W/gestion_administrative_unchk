<form (ngSubmit)="publier()" class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-2xl shadow space-y-5">

    <h2 class="text-2xl font-bold text-center">
        Publier un rapport
    </h2>

    <input type="number" [(ngModel)]="reunionId" name="reunionId" placeholder="ID Réunion" required
        class="w-full border rounded-xl px-4 py-3" />

    <input type="text" [(ngModel)]="titre" name="titre" placeholder="Titre" required
        class="w-full border rounded-xl px-4 py-3" />

    <textarea [(ngModel)]="contenu" name="contenu" placeholder="Contenu du rapport" rows="6" required
        class="w-full border rounded-xl px-4 py-3"></textarea>

    <button type="submit" class="w-full bg-violet-600 text-white py-3 rounded-xl hover:bg-violet-700">
        Publier
    </button>

    <p *ngIf="message" class="text-green-600 text-center">
        {{ message }}
    </p>

</form>
