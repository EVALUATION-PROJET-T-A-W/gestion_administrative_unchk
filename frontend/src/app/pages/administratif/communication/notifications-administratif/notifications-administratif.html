<div class="max-w-5xl mx-auto mt-10 space-y-6">

    <div class="flex items-center justify-between">

        <div>
            <h2 class="text-4xl font-bold text-gray-800">
                Notifications
            </h2>

            <p class="text-gray-500 mt-1">
                Consultez vos dernières notifications
            </p>
        </div>

        <div class="w-14 h-14 rounded-2xl bg-violet-100 flex items-center justify-center shadow-sm">

            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-violet-700" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">

                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V4a2 2 0 10-4 0v1.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>

        </div>

    </div>

    <div *ngIf="errorMessage" class="bg-red-100 border border-red-200 text-red-600 p-4 rounded-2xl shadow-sm">

        {{ errorMessage }}

    </div>

    <div *ngFor="let notification of notifications"
        class="group relative bg-white border border-gray-100 rounded-3xl p-6 shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden">

        <div class="absolute top-0 left-0 w-2 h-full" [ngClass]="notification.lue ? 'bg-green-400' : 'bg-violet-600'">
        </div>

        <div class="flex items-start justify-between gap-5">

            <div class="flex gap-4 flex-1">

                <div class="min-w-[55px] h-[55px] rounded-2xl flex items-center justify-center" [ngClass]="notification.lue
                    ? 'bg-green-100 text-green-600'
                    : 'bg-violet-100 text-violet-700'">

                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">

                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V4a2 2 0 10-4 0v1.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>

                </div>

                <div class="flex-1 space-y-2">

                    <div class="flex items-center gap-3 flex-wrap">

                        <h3 class="text-lg font-bold text-gray-800">

                            {{ notification.titre }}

                        </h3>

                        <span *ngIf="!notification.lue"
                            class="bg-violet-100 text-violet-700 text-xs font-semibold px-3 py-1 rounded-full">

                            Nouveau

                        </span>

                    </div>

                    <p class="text-gray-600 leading-relaxed">

                        {{ notification.message }}

                    </p>

                    <div class="flex items-center gap-2 text-sm text-gray-400">

                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">

                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>

                        <span>
                            {{ notification.dateCreation }}
                        </span>

                    </div>

                </div>

            </div>

            <div class="flex items-center">

                <span *ngIf="notification.lue"
                    class="bg-green-100 text-green-700 px-4 py-2 rounded-xl text-sm font-semibold">
                    ✓ Déjà lue
                </span>

                <button *ngIf="!notification.lue" (click)="marquerCommeLue(notification.id)"
                    class="bg-violet-600 hover:bg-violet-700 text-white px-5 py-3 rounded-2xl font-medium shadow-md hover:shadow-lg transition-all duration-300">

                    Marquer comme lue

                </button>

            </div>

        </div>

    </div>

</div>
