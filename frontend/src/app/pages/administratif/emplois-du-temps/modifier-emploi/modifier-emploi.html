<div class="bg-white p-4 rounded-xl shadow-md">

  <h3 class="font-bold mb-3">Modifier emploi</h3>

  <input class="border p-2 rounded-xl w-full mb-2"
         [(ngModel)]="emploi.jour"
         placeholder="Jour">

  <input class="border p-2 rounded-xl w-full mb-2"
         [(ngModel)]="emploi.salle"
         placeholder="Salle">

  <input class="border p-2 rounded-xl w-full mb-2"
         [(ngModel)]="emploi.module"
         placeholder="Module">

  <button class="bg-yellow-500 text-white px-4 py-2 rounded-xl">
    Modifier
  </button>

</div>
