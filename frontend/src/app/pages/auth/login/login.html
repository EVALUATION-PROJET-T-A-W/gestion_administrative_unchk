<form (ngSubmit)="seConnecter()" class="w-[400px] mt-20 p-12
           bg-white/10
           backdrop-blur-xl
           border border-white/20
           rounded-2xl
           shadow-2xl
           space-y-5">

    <div class="text-center space-y-1">
        <h2 class="text-2xl font-bold text-white">Connexion</h2>
        <p class="text-sm text-gray-200">Accédez à votre espace</p>
    </div>

    <input type="email" [(ngModel)]="email" name="email" placeholder="Email" required class="w-full px-4 py-3
               bg-white/20
               border border-white/30
               text-white
               placeholder-gray-300
               rounded-xl
               focus:outline-none
               focus:ring-2
               focus:ring-white/50" />

    <input type="password" [(ngModel)]="motDePasse" name="motDePasse" placeholder="Mot de passe" required class="w-full px-4 py-3
               bg-white/20
               border border-white/30
               text-white
               placeholder-gray-300
               rounded-xl
               focus:outline-none
               focus:ring-2
               focus:ring-white/50" />

    <button type="submit" class="w-full py-3
               bg-white/20
               border border-white/30
               text-white
               rounded-xl
               font-semibold
               hover:bg-white/30
               transition">
        Connexion
    </button>
    <p>
        Vous n'avez pas de compte ?
        <a routerLink="/register" class="text-blue-500">
            Créer un compte
        </a>
    </p>
    <p *ngIf="errorMessage" class="text-red-300 text-sm text-center">
        {{ errorMessage }}
    </p>

</form>
