<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div class="bg-white rounded-xl shadow-md p-6 w-full max-w-md">

    <h2 class="text-xl font-bold text-center text-slate-700 mb-4">
      Connexion
    </h2>

    <form (ngSubmit)="seConnecter()" class="space-y-4">

      <input
        class="w-full border rounded-xl p-2"
        [(ngModel)]="email"
        name="email"
        type="email"
        placeholder="Email">

      <input
        class="w-full border rounded-xl p-2"
        [(ngModel)]="password"
        name="password"
        type="password"
        placeholder="Mot de passe">

      <button
        class="w-full bg-blue-600 text-white rounded-xl p-2 hover:shadow-lg transition-all">

        Se connecter

      </button>

    </form>

    <p class="text-red-500 text-sm text-center mt-2">
      {{ error }}
    </p>

    <div class="text-center mt-3 text-sm">
      <a routerLink="/forgot-password" class="text-blue-600 hover:underline">
        Mot de passe oublié ?
      </a>
    </div>

  </div>

</div>
