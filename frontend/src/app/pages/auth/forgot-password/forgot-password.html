<div class="min-h-screen bg-gray-100 flex items-center justify-center p-6">

  <div class="bg-white rounded-xl shadow-md p-6 w-full max-w-md">

    <h2 class="text-xl font-bold text-slate-700 mb-4 text-center">
      Mot de passe oublié
    </h2>

    <form (ngSubmit)="envoyer()" class="space-y-4">

      <input
        class="w-full border rounded-xl p-2"
        [(ngModel)]="email"
        name="email"
        placeholder="Votre email"
        type="email">

      <button
        class="w-full bg-blue-600 text-white rounded-xl p-2 hover:shadow-lg transition-all">

        Envoyer le lien

      </button>

    </form>

    <p class="text-center mt-3 text-sm text-slate-600">
      {{ message }}
    </p>

  </div>

</div>
