<form #registerForm="ngForm" (ngSubmit)="inscrireFormateur(registerForm)" class="space-y-6">

    <!-- Titre -->
    <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-white">
            Inscription Formateur
        </h2>

        <p class="text-gray-300 mt-2">
            Créez votre compte formateur
        </p>
    </div>

    <!-- Nom / Prenom -->
    <div class="grid grid-cols-2 gap-4">

        <div>
            <label class="text-white text-sm mb-2 block">
                Nom
            </label>

            <input type="text" [(ngModel)]="nom" name="nom" placeholder="Votre nom" class="w-full px-4 py-3 bg-white/20 border border-white/30
                       text-white placeholder-gray-300 rounded-xl
                       focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div>
            <label class="text-white text-sm mb-2 block">
                Prénom
            </label>

            <input type="text" [(ngModel)]="prenom" name="prenom" placeholder="Votre prénom" class="w-full px-4 py-3 bg-white/20 border border-white/30
                       text-white placeholder-gray-300 rounded-xl
                       focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

    </div>

    <!-- Email / Téléphone -->
    <div class="grid grid-cols-2 gap-4">

        <div>
            <label class="text-white text-sm mb-2 block">
                Email
            </label>

            <input type="email" [(ngModel)]="email" name="email" placeholder="email@uchk.sn" class="w-full px-4 py-3 bg-white/20 border border-white/30
                       text-white placeholder-gray-300 rounded-xl
                       focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div>
            <label class="text-white text-sm mb-2 block">
                Téléphone
            </label>

            <input type="text" [(ngModel)]="telephone" name="telephone" placeholder="+221..." class="w-full px-4 py-3 bg-white/20 border border-white/30
                       text-white placeholder-gray-300 rounded-xl
                       focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

    </div>

    <!-- Mot de passe -->
    <div>

        <label class="text-white text-sm mb-2 block">
            Mot de passe
        </label>

        <input type="password" [(ngModel)]="motDePasse" name="motDePasse" placeholder="********" class="w-full px-4 py-3 bg-white/20 border border-white/30
                   text-white placeholder-gray-300 rounded-xl
                   focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <!-- Specialite / Grade -->
    <div class="grid grid-cols-2 gap-4">

        <div>
            <label class="text-white text-sm mb-2 block">
                Spécialité
            </label>

            <input type="text" [(ngModel)]="specialite" name="specialite" placeholder="Informatique" class="w-full px-4 py-3 bg-white/20 border border-white/30
                       text-white placeholder-gray-300 rounded-xl
                       focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div>
            <label class="text-white text-sm mb-2 block">
                Grade
            </label>

            <input type="text" [(ngModel)]="grade" name="grade" placeholder="Docteur, Professeur..." class="w-full px-4 py-3 bg-white/20 border border-white/30
                       text-white placeholder-gray-300 rounded-xl
                       focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

    </div>

    <!-- Département / Type -->
    <div class="grid grid-cols-2 gap-4">

        <div>
            <label class="text-white text-sm mb-2 block">
                Département
            </label>

            <input type="text" [(ngModel)]="departement" name="departement" placeholder="Département" class="w-full px-4 py-3 bg-white/20 border border-white/30
                       text-white placeholder-gray-300 rounded-xl
                       focus:outline-none focus:ring-2 focus:ring-blue-400">
        </div>

        <div>
            <label class="text-white text-sm mb-2 block">
                Type de formateur
            </label>

            <select [(ngModel)]="typeFormateur" name="typeFormateur" class="w-full px-4 py-3 bg-white/20 border border-white/30
                       text-white rounded-xl
                       focus:outline-none focus:ring-2 focus:ring-blue-400">

                <option value="" class="text-black">
                    Sélectionner
                </option>

                <option value="ENSEIGNANT" class="text-black">
                    Enseignant
                </option>

                <option value="ENSEIGNANT_ASSOCIE" class="text-black">
                    Enseignant Associé
                </option>

                <option value="TUTEUR" class="text-black">
                    Tuteur
                </option>

            </select>
        </div>

    </div>

    <!-- Upload Photo -->

    <div>

        <label class="text-white text-sm mb-2 block">
            Photo de profil
        </label>

        <input type="file" (change)="onFileSelected($event)" class="w-full text-white
                   file:mr-4
                   file:px-4
                   file:py-2
                   file:rounded-lg
                   file:border-0
                   file:bg-blue-500
                   file:text-white
                   hover:file:bg-blue-600">
    </div>

    <!-- Bouton -->

    <button type="submit" class="w-full py-4
               bg-gradient-to-r
               from-blue-500
               to-indigo-600
               text-white
               rounded-xl
               font-semibold
               hover:scale-[1.02]
               transition-all
               shadow-lg">

        Inscrire le formateur

    </button>

    <p class="text-center text-gray-200">

        Déjà un compte ?

        <a routerLink="/home" class="text-blue-300 hover:text-blue-200 font-medium">

            Se connecter

        </a>

    </p>

</form>
