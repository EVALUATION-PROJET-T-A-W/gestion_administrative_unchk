<section class="relative min-h-screen overflow-hidden bg-gradient-to-r from-slate-950 via-slate-900 to-blue-950">

    <div class="container mx-auto px-6 ">
        <div class="grid min-h-[80vh] items-center gap-10 lg:grid-cols-2">

            <div class="space-y-8">

                <div class="w-[500px] mt-10 p-10
    bg-white/10
    backdrop-blur-xl
    border border-white/20
    rounded-2xl
    shadow-2xl
    space-y-4">

                    <div class="text-center mb-6">

                        <h2 class="text-3xl font-bold text-white">
                            Créer un compte
                        </h2>

                        <p class="text-gray-200 mt-2">
                            Choisissez votre type de compte
                        </p>

                    </div>

                    <select [(ngModel)]="typeCompte" name="typeCompte" class="w-full px-4 py-3
                   bg-white/20
                   border border-white/30
                   text-white
                   rounded-xl
                   mb-6">

                        <option value="ETUDIANT" class="text-black">
                            Étudiant
                        </option>

                        <option value="FORMATEUR" class="text-black">
                            Formateur
                        </option>

                    </select>

                    <!-- FORMULAIRE ETUDIANT -->

                    <div *ngIf="typeCompte === 'ETUDIANT'">

                        <app-register-etudiant></app-register-etudiant>

                    </div>

                    <!-- FORMULAIRE FORMATEUR -->

                    <div *ngIf="typeCompte === 'FORMATEUR'">

                        <app-register-formateur></app-register-formateur>

                    </div>

                </div>
            </div>

            <div class="flex justify-center">

                <img src="/images/banner.png" alt="Education" class="w-full max-w-2xl object-contain" />

            </div>

        </div>
    </div>

</section>
