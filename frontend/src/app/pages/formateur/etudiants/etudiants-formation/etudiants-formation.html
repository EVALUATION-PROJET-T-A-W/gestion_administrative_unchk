<div class="min-h-screen bg-gray-100 p-6">

  <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md p-6">

    <h2 class="text-2xl font-bold text-slate-700 mb-2">
      Étudiants de la formation
    </h2>

    <p class="text-gray-500 mb-6">
      {{ formation.nom }}
    </p>

    <table class="w-full border-collapse">

      <thead>
      <tr class="bg-slate-100">
        <th class="border p-3">Nom</th>
        <th class="border p-3">Prénom</th>
        <th class="border p-3">INE</th>
        <th class="border p-3">Promotion</th>
      </tr>
      </thead>

      <tbody>

      <tr *ngFor="let e of etudiants" class="hover:bg-gray-50">

        <td class="border p-3">{{ e.nom }}</td>
        <td class="border p-3">{{ e.prenom }}</td>
        <td class="border p-3">{{ e.ine }}</td>
        <td class="border p-3">{{ e.promotion }}</td>

      </tr>

      </tbody>

    </table>

  </div>

</div>
