<div class="min-h-screen bg-gray-100 p-6">

  <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md p-6">

    <h2 class="text-2xl font-bold text-slate-700 mb-6">
      Notifications
    </h2>

    <div class="space-y-4">

      <div *ngFor="let n of notifications"
           class="border rounded-xl p-4 hover:shadow-md"
           [ngClass]="n.lu ? 'bg-gray-50' : 'bg-yellow-50'">

        <div class="flex justify-between items-center">

          <h3 class="font-bold text-slate-800">
            {{ n.titre }}
          </h3>

          <span class="text-sm text-gray-500">
            {{ n.date }}
          </span>

        </div>

        <p class="text-gray-700 mt-2">
          {{ n.contenu }}
        </p>

        <div class="mt-3 flex gap-3">

          <button
            class="px-3 py-1 bg-green-600 text-white rounded-lg"
            (click)="marquerCommeLu(n)"
            *ngIf="!n.lu">

            Marquer comme lu

          </button>

          <button
            class="px-3 py-1 bg-red-600 text-white rounded-lg"
            (click)="supprimer(n.id)">

            Supprimer

          </button>

        </div>

      </div>

    </div>

  </div>

</div>
