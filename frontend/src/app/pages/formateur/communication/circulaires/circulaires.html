<div class="min-h-screen bg-gray-100 p-6">

  <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-md p-6">

    <h2 class="text-2xl font-bold text-slate-700 mb-6">
      Circulaires & Annonces
    </h2>

    <div class="space-y-4">

      <div *ngFor="let c of circulaires"
           class="border rounded-xl p-4 bg-gray-50 hover:shadow-md">

        <h3 class="text-lg font-bold text-slate-800">
          {{ c.titre }}
        </h3>

        <p class="text-gray-700 mt-2">
          {{ c.contenu }}
        </p>

        <span class="text-sm text-gray-500 mt-2 block">
          {{ c.date }}
        </span>

      </div>

    </div>

  </div>

</div>
