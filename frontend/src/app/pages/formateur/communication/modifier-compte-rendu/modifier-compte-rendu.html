<div class="min-h-screen bg-gray-100 p-6 flex justify-center">

  <div class="bg-white shadow-md rounded-xl p-6 w-full max-w-3xl">

    <h2 class="text-2xl font-bold mb-6 text-slate-700">
      Modifier le compte rendu
    </h2>

    <form (ngSubmit)="modifier()" class="space-y-4">

      <input
        type="text"
        [(ngModel)]="compteRendu.titre"
        name="titre"
        class="w-full border p-2 rounded-lg"
        placeholder="Titre"
        required>

      <textarea
        [(ngModel)]="compteRendu.contenu"
        name="contenu"
        rows="6"
        class="w-full border p-2 rounded-lg"
        placeholder="Contenu"
        required>
      </textarea>

      <input
        type="date"
        [(ngModel)]="compteRendu.date"
        name="date"
        class="w-full border p-2 rounded-lg"
        required>

      <input
        type="number"
        [(ngModel)]="compteRendu.stageId"
        name="stageId"
        class="w-full border p-2 rounded-lg"
        placeholder="ID du stage">

      <button
        type="submit"
        class="w-full bg-yellow-600 text-white p-3 rounded-lg hover:bg-yellow-700">

        Modifier

      </button>

    </form>

  </div>

</div>
