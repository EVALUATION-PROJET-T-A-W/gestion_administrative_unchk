<div class="max-w-6xl mx-auto">

    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">

        <!-- Header -->

        <div class="bg-slate-900 text-white p-8">

            <div class="flex items-center gap-6">

                <img [src]="'http://localhost:8080/uploads/' + profil.photo"
                    class="w-32 h-32 rounded-full object-cover border-4 border-white">

                <div>

                    <h1 class="text-3xl font-bold">
                        {{ profil.prenom }} {{profil.nom }}
                    </h1>

                    <p class="text-slate-300 text-lg">
                        Formateur
                    </p>

                    <p class="text-slate-400">
                        {{ profil.email }}
                    </p>

                </div>

            </div>

        </div>

        <!-- Informations -->

        <div class="p-8">

            <h2 class="text-2xl font-bold text-slate-800 mb-6">
                Informations personnelles
            </h2>

            <div class="grid md:grid-cols-2 gap-6">

                <div>
                    <label class="block text-sm text-gray-500 mb-2">
                        Nom
                    </label>

                    <input type="text" [(ngModel)]="nom" class="w-full border rounded-xl px-4 py-3">
                </div>

                <div>
                    <label class="block text-sm text-gray-500 mb-2">
                        Prénom
                    </label>

                    <input type="text" [(ngModel)]="prenom" class="w-full border rounded-xl px-4 py-3">
                </div>

                <div>
                    <label class="block text-sm text-gray-500 mb-2">
                        Email
                    </label>

                    <input type="email" [(ngModel)]="email" disabled
                        class="w-full border rounded-xl px-4 py-3 bg-gray-100">
                </div>

                <div>
                    <label class="block text-sm text-gray-500 mb-2">
                        Téléphone
                    </label>

                    <input type="text" [(ngModel)]="telephone" class="w-full border rounded-xl px-4 py-3">
                </div>

                <div>
                    <label class="block text-sm text-gray-500 mb-2">
                        Spécialité
                    </label>

                    <input type="text" [(ngModel)]="specialite" class="w-full border rounded-xl px-4 py-3">
                </div>

                <div>
                    <label class="block text-sm text-gray-500 mb-2">
                        Grade
                    </label>

                    <input type="text" [(ngModel)]="grade" class="w-full border rounded-xl px-4 py-3">
                </div>

                <div>
                    <label class="block text-sm text-gray-500 mb-2">
                        Département
                    </label>

                    <input type="text" [(ngModel)]="departement" class="w-full border rounded-xl px-4 py-3">
                </div>

                <div>
                    <label class="block text-sm text-gray-500 mb-2">
                        Type de formateur
                    </label>
                    <select [(ngModel)]="typeFormateur" name="typeFormateur" class="w-full border rounded-xl px-4 py-3">
                        <option value="ENSEIGNANT">
                            Enseignant
                        </option>

                        <option value="ENSEIGNANT_ASSOCIE">
                            Enseignant associé
                        </option>

                        <option value="RESPONSABLE_FORMATION">
                            Responsable de formation
                        </option>

                    </select>
                </div>

            </div>

            <!-- Photo -->

            <div class="mt-8">

                <label class="block text-sm text-gray-500 mb-2">
                    Modifier la photo
                </label>

                <input type="file" (change)="onFileSelected($event)" class="block w-full border rounded-xl px-4 py-3">

            </div>

            <!-- Bouton -->

            <div class="mt-8 flex justify-end">

                <button (click)="modifierProfil()"
                    class="bg-slate-900 text-white px-8 py-3 rounded-xl hover:bg-slate-800 transition">

                    Enregistrer les modifications

                </button>

            </div>

        </div>

    </div>

</div>
