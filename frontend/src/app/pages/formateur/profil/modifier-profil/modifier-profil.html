<div class="min-h-screen bg-gray-100 flex justify-center items-center p-6">

  <div class="bg-white shadow-lg rounded-xl p-6 w-full max-w-2xl">

    <h2 class="text-2xl font-bold text-slate-700 mb-6">
      Modifier mon profil
    </h2>

    <form (ngSubmit)="enregistrer()" class="space-y-4">

      <input
        type="text"
        [(ngModel)]="utilisateur.nom"
        name="nom"
        placeholder="Nom"
        class="w-full border rounded-lg p-2">

      <input
        type="text"
        [(ngModel)]="utilisateur.prenom"
        name="prenom"
        placeholder="Prénom"
        class="w-full border rounded-lg p-2">

      <input
        type="email"
        [(ngModel)]="utilisateur.email"
        name="email"
        placeholder="Email"
        class="w-full border rounded-lg p-2">

      <input
        type="text"
        [(ngModel)]="utilisateur.telephone"
        name="telephone"
        placeholder="Téléphone"
        class="w-full border rounded-lg p-2">

      <input
        type="file"
        (change)="onFileSelected($event)"
        class="w-full border rounded-lg p-2">

      <button
        type="submit"
        class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700">

        Enregistrer les modifications

      </button>

    </form>

  </div>

</div>
