<div class="min-h-screen bg-gray-100 flex justify-center p-6">

  <div class="bg-white shadow-lg rounded-xl p-6 w-full max-w-3xl">

    <h2 class="text-2xl font-bold text-slate-700 mb-6">
      Ajouter une réunion
    </h2>

    <form (ngSubmit)="enregistrer()" class="space-y-4">

      <input
        type="text"
        [(ngModel)]="reunion.titre"
        name="titre"
        placeholder="Titre de la réunion"
        class="w-full border rounded-lg p-2"
        required>

      <input
        type="date"
        [(ngModel)]="reunion.date"
        name="date"
        class="w-full border rounded-lg p-2"
        required>

      <input
        type="time"
        [(ngModel)]="reunion.heure"
        name="heure"
        class="w-full border rounded-lg p-2"
        required>

      <input
        type="text"
        [(ngModel)]="reunion.lieu"
        name="lieu"
        placeholder="Lieu de la réunion"
        class="w-full border rounded-lg p-2"
        required>

      <textarea
        [(ngModel)]="reunion.ordreDuJour"
        name="ordreDuJour"
        rows="5"
        placeholder="Ordre du jour"
        class="w-full border rounded-lg p-2">
      </textarea>

      <button
        type="submit"
        class="w-full bg-green-600 text-white p-3 rounded-lg hover:bg-green-700">

        Ajouter la réunion

      </button>

    </form>

  </div>

</div>
