<div class="min-h-screen bg-gray-100 p-6">

  <div class="max-w-6xl mx-auto">

    <h2 class="text-2xl font-bold text-slate-700 mb-6">
      Dashboard Formateur
    </h2>

    <!-- STATS -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

      <div class="bg-white p-4 rounded-xl shadow text-center">
        <h3 class="text-gray-500">Formations</h3>
        <p class="text-2xl font-bold">{{ totalFormations }}</p>
      </div>

      <div class="bg-white p-4 rounded-xl shadow text-center">
        <h3 class="text-gray-500">Étudiants</h3>
        <p class="text-2xl font-bold">{{ totalEtudiants }}</p>
      </div>

      <div class="bg-white p-4 rounded-xl shadow text-center">
        <h3 class="text-gray-500">Stages</h3>
        <p class="text-2xl font-bold">{{ totalStages }}</p>
      </div>

    </div>

    <!-- NOTIFICATIONS -->
    <div class="bg-white p-6 rounded-xl shadow">

      <h3 class="text-xl font-bold mb-4">
        Notifications récentes
      </h3>

      <div class="space-y-3">

        <div *ngFor="let n of notifications"
             class="border p-3 rounded-lg bg-gray-50">

          <p class="text-gray-800">
            {{ n.message }}
          </p>

          <span class="text-sm text-gray-500">
            {{ n.date }}
          </span>

        </div>

      </div>

    </div>

  </div>

</div>
