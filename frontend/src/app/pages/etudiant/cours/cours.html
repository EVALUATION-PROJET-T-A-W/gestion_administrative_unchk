<div class="p-6 bg-gray-50 min-h-screen">

    <!-- HEADER -->
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Mes Cours</h1>
        <p class="text-gray-500">Liste des cours liés à vos formations</p>
    </div>

    <!-- LOADING -->
    <div *ngIf="loading" class="text-gray-500">
        Chargement des cours...
    </div>

    <!-- EMPTY STATE -->
    <div *ngIf="!loading && cours.length === 0" class="text-center text-gray-500 mt-10">
        Aucun cours disponible
    </div>

    <!-- LISTE COURS -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <div *ngFor="let c of cours" class="border rounded-2xl bg-white p-5 shadow-sm hover:shadow-md transition">

            <!-- TITRE -->
            <h2 class="text-lg font-semibold text-gray-900">
                {{ c.titre }}
            </h2>

            <!-- DESCRIPTION -->
            <p class="text-sm text-gray-500 mt-2">
                {{ c.description }}
            </p>

            <!-- DATE -->
            <div class="mt-4 text-sm text-gray-600">
                📅 {{ c.dateCours }}
            </div>

            <!-- BADGE FORMATION -->
            <div class="mt-3">
                <span class="px-3 py-1 text-xs rounded-full bg-indigo-100 text-indigo-600">
                    {{ c.formation?.nomFormation }}
                </span>
            </div>

            <!-- SUPPORT -->
            <div class="mt-3">
                <a *ngIf="c.supportCours" [href]="c.supportCours" target="_blank"
                    class="text-blue-600 text-sm hover:underline">
                    📎 Voir support
                </a>
            </div>

        </div>

    </div>

</div>
