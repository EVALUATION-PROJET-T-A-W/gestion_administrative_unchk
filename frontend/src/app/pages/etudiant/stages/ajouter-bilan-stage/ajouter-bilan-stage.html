<form (ngSubmit)="ajouterStage()" class="bg-white rounded-2xl shadow-lg p-8 space-y-5">

    <h2 class="text-2xl font-bold text-slate-800">
        Ajouter un stage
    </h2>

    <input type="text" placeholder="Entreprise" [(ngModel)]="entreprise" name="entreprise"
        class="w-full border rounded-xl px-4 py-3">

    <div class="grid grid-cols-2 gap-4">

        <div>

            <label class="block mb-2 text-sm text-gray-500">
                Date début
            </label>

            <input type="date" [(ngModel)]="dateDebut" name="dateDebut" class="w-full border rounded-xl px-4 py-3">

        </div>

        <div>

            <label class="block mb-2 text-sm text-gray-500">
                Date fin
            </label>

            <input type="date" [(ngModel)]="dateFin" name="dateFin" class="w-full border rounded-xl px-4 py-3">

        </div>

    </div>

    <select [(ngModel)]="statut" name="statut" class="w-full border rounded-xl px-4 py-3">

        <option value="">
            Choisir un statut
        </option>

        <option value="EN_COURS">
            En cours
        </option>

        <option value="TERMINE">
            Terminé
        </option>

        <option value="VALIDE">
            Validé
        </option>

    </select>

    <textarea rows="5" placeholder="Bilan du stage" [(ngModel)]="bilan" name="bilan"
        class="w-full border rounded-xl px-4 py-3">
    </textarea>

    <button type="submit" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700">

        Enregistrer le stage

    </button>

</form>
