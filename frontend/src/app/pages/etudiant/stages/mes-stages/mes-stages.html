<div class="space-y-6">

    <div class="flex justify-between items-center">

        <h1 class="text-3xl font-bold text-slate-800">
            🎓 Mes Stages
        </h1>

        <button routerLink="../ajouterStage"
            class="px-6 py-3 bg-indigo-600 text-white font-semibold rounded-xl shadow-lg hover:bg-indigo-700 transition duration-300">

            ➕ Ajouter un stage
        </button>
    </div>

    <div *ngIf="stages.length === 0" class="bg-white rounded-2xl p-10 shadow text-center">

        <p class="text-gray-500 text-lg">
            Aucun stage enregistré.
        </p>

    </div>

    <div class="grid lg:grid-cols-2 gap-6">

        <div *ngFor="let stage of stages"
            class="bg-white rounded-2xl shadow-lg border border-gray-100 overflow-hidden hover:shadow-xl transition">

            <!-- Header -->
            <div class="bg-gradient-to-r from-indigo-600 to-blue-600 p-5 text-white">

                <h2 class="text-xl font-bold">
                    🏢 {{ stage.entreprise }}
                </h2>

                <span class="inline-block mt-2 px-3 py-1 rounded-full text-sm bg-white/20">
                    {{ stage.statut }}
                </span>

            </div>

            <!-- Body -->
            <div class="p-6 space-y-4">

                <div class="grid grid-cols-2 gap-4">

                    <div class="bg-slate-50 p-4 rounded-xl">

                        <p class="text-sm text-gray-500">
                            📅 Début
                        </p>

                        <p class="font-semibold">
                            {{ stage.dateDebut | date:'dd/MM/yyyy' }}
                        </p>

                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl">

                        <p class="text-sm text-gray-500">
                            📅 Fin
                        </p>

                        <p class="font-semibold">
                            {{ stage.dateFin | date:'dd/MM/yyyy' }}
                        </p>

                    </div>

                </div>

                <div>

                    <h3 class="font-semibold text-slate-700 mb-2">
                        📝 Bilan du stage
                    </h3>

                    <p class="text-gray-600 leading-relaxed">
                        {{ stage.bilan }}
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>
