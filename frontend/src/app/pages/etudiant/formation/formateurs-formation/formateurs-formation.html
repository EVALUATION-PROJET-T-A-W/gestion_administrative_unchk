<div class="min-h-screen bg-gray-100 p-6">

  <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md p-6">

    <h2 class="text-2xl font-bold text-slate-700 mb-6">
      Formateurs de la formation
    </h2>

    <table class="w-full border-collapse">

      <thead>
      <tr class="bg-slate-100">
        <th class="border p-3">Nom</th>
        <th class="border p-3">Prénom</th>
        <th class="border p-3">Spécialité</th>
        <th class="border p-3">Grade</th>
        <th class="border p-3">Département</th>
        <th class="border p-3">Type</th>
      </tr>
      </thead>

      <tbody>

      <tr *ngFor="let f of formateurs" class="hover:bg-gray-50">

        <td class="border p-3">{{ f.nom }}</td>
        <td class="border p-3">{{ f.prenom }}</td>
        <td class="border p-3">{{ f.specialite }}</td>
        <td class="border p-3">{{ f.grade }}</td>
        <td class="border p-3">{{ f.departement }}</td>
        <td class="border p-3">{{ f.typeFormateur }}</td>

      </tr>

      </tbody>

    </table>

  </div>

</div>
