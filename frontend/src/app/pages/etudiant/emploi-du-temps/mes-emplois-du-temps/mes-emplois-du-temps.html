<div class="min-h-screen bg-gray-100 p-6">

  <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md p-6">

    <h2 class="text-2xl font-bold text-slate-700 mb-6">
      Mon emploi du temps
    </h2>

    <table class="w-full border-collapse">

      <thead>
      <tr class="bg-slate-100">
        <th class="border p-3">Jour</th>
        <th class="border p-3">Heure début</th>
        <th class="border p-3">Heure fin</th>
        <th class="border p-3">Salle</th>
        <th class="border p-3">Module</th>
      </tr>
      </thead>

      <tbody>

      <tr *ngFor="let emploi of emplois" class="hover:bg-gray-50">

        <td class="border p-3">{{ emploi.jour }}</td>
        <td class="border p-3">{{ emploi.heureDebut }}</td>
        <td class="border p-3">{{ emploi.heureFin }}</td>
        <td class="border p-3">{{ emploi.salle }}</td>
        <td class="border p-3">{{ emploi.module }}</td>

      </tr>

      </tbody>

    </table>

  </div>

</div>
