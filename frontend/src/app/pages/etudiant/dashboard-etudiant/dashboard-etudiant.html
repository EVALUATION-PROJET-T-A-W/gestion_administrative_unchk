<div class="min-h-screen bg-gray-100 p-6">

  <h1 class="text-3xl font-bold text-slate-800 mb-6">
    Tableau de bord Étudiant
  </h1>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

    <div class="bg-white rounded-xl shadow-md p-6">
      <h3 class="text-gray-500">Cours</h3>
      <p class="text-3xl font-bold text-blue-600">
        {{ nombreCours }}
      </p>
    </div>

    <div class="bg-white rounded-xl shadow-md p-6">
      <h3 class="text-gray-500">Documents</h3>
      <p class="text-3xl font-bold text-green-600">
        {{ nombreDocuments }}
      </p>
    </div>

    <div class="bg-white rounded-xl shadow-md p-6">
      <h3 class="text-gray-500">Stages</h3>
      <p class="text-3xl font-bold text-purple-600">
        {{ nombreStages }}
      </p>
    </div>

    <div class="bg-white rounded-xl shadow-md p-6">
      <h3 class="text-gray-500">Notifications</h3>
      <p class="text-3xl font-bold text-red-600">
        {{ nombreNotifications }}
      </p>
    </div>

  </div>

  <div class="mt-8 bg-white rounded-xl shadow-md p-6">

    <h2 class="text-xl font-semibold mb-4">
      Bienvenue sur votre espace étudiant
    </h2>

    <p class="text-gray-600">
      Consultez vos formations, votre emploi du temps,
      vos documents pédagogiques et suivez vos stages.
    </p>

  </div>

</div>
