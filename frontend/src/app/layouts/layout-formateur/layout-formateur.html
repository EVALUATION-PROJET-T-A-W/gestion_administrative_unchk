<div class="flex h-screen bg-slate-100">

    <!-- Sidebar -->
    <aside class="w-72 bg-slate-900 text-white flex flex-col">

        <div class="p-6 border-b border-slate-700">

            <div class="flex items-center gap-3">

                <img [src]="'http://localhost:8080/uploads/' + profil.photo"
                    class="w-14 h-14 rounded-full object-cover border-2 border-white">

                <div>
                    <h2 class="font-bold">
                        {{ prenom }} {{ nom }}
                    </h2>

                    <p class="text-sm text-slate-400">
                        Formateur
                    </p>
                </div>

            </div>

        </div>

        <nav class="flex-1 p-4 space-y-2">

            <a routerLink="/dashboardFormateur" class="block px-4 py-3 rounded-xl hover:bg-slate-800">
                📊 Tableau de bord
            </a>

            <a routerLink="dashboardFormateur/profil" class="block px-4 py-3 rounded-xl hover:bg-slate-800">
                👤 Mon Profil
            </a>

            <a routerLink="dashboardFormateur/formation" class="block px-4 py-3 rounded-xl hover:bg-slate-800">
                🎓 Mes Formations
            </a>

            <a routerLink="dashboardFormateur/etudiants" class="block px-4 py-3 rounded-xl hover:bg-slate-800">
                👨‍🎓 Étudiants
            </a>

            <a routerLink="dashboardFormateur/emploi-du-temps" class="block px-4 py-3 rounded-xl hover:bg-slate-800">
                📅 Emploi du temps
            </a>

            <a routerLink="dashboardFormateur/comptes-rendus" class="block px-4 py-3 rounded-xl hover:bg-slate-800">
                📝 Comptes rendus
            </a>

            <a routerLink="/dashboardFormateur/circulaires" class="block px-4 py-3 rounded-xl hover:bg-slate-800">
                📢 Circulaires
            </a>

            <a routerLink="dashboardFormateur/notifications" class="block px-4 py-3 rounded-xl hover:bg-slate-800">
                🔔 Notifications
            </a>

            <a routerLink="dashboardFormateur/reunions" class="block px-4 py-3 rounded-xl hover:bg-slate-800">
                🤝 Réunions
            </a>

            <a routerLink="dashboardFormateur/partenaires" class="block px-4 py-3 rounded-xl hover:bg-slate-800">
                ➕ Créer une réunion
            </a>

        </nav>

        <div class="p-4 border-t border-slate-700">

            <button (click)="logout()" class="w-full bg-red-500 hover:bg-red-600 py-3 rounded-xl">

                Déconnexion

            </button>

        </div>

    </aside>

    <!-- Contenu -->
    <main class="flex-1 overflow-auto">

        <header class="bg-white shadow px-8 py-4">

            <h1 class="text-2xl font-bold text-slate-800">
                Espace Formateur
            </h1>

        </header>

        <section class="p-8">

            <router-outlet></router-outlet>

        </section>

    </main>

</div>
